# Builds ffmpegnodes for Windows, macOS and Linux and attaches the installers
# to a draft GitHub Release. Trigger: push a tag like v0.8.0 (or run manually).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: ubuntu-22.04
            args: ""
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux system packages
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: pnpm install --frozen-lockfile

      # the bundled filter docs (help popups) must match the newest FFmpeg release
      - run: node scripts/check-filter-docs.mjs

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: ffmpegnodes ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          # Install notes for every release; keep them at the end of the release notes.
          releaseBody: |
            ## Install notes
            - Unsigned builds
            - ffmpeg and ffprobe are not included: install them and set their paths in ⚙ Settings. Use static builds.
            - macOS: right-click the app → Open the first time
            - Windows: SmartScreen → More info → Run anyway
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
