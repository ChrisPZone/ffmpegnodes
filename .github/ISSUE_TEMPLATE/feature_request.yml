name: Feature request
description: An idea for a new feature or an improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What do you want to do?
      description: The task or problem, rather than a solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could ffmpegnodes help?
      description: Your idea. ffmpeg options or commands you would use today are helpful.
  - type: textarea
    id: alternatives
    attributes:
      label: Workarounds
      description: How you do it now, if at all.
