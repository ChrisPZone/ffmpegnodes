name: Bug report
description: Something doesn't work as expected
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Add an Input with an MKV file
        2. Connect ...
        3. Click Run
  - type: textarea
    id: command
    attributes:
      label: Generated ffmpeg command
      description: Copy it from the Command tab.
      render: shell
  - type: textarea
    id: log
    attributes:
      label: Log
      description: From the Log tab, if a run failed.
      render: text
  - type: input
    id: version
    attributes:
      label: ffmpegnodes version
      placeholder: "0.9.2"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Linux
    validations:
      required: true
  - type: input
    id: ffmpeg
    attributes:
      label: ffmpeg version
      description: First line of `ffmpeg -version`.
      placeholder: ffmpeg version 8.0 ...
